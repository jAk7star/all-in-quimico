name: CI — Validação Científica, Mecânica & Impressão

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pyyaml sympy jinja2 pytest

      - name: SPEC-00 — Validar Base de Conhecimento Químico
        run: |
          python specs/SPEC-00-fundamentos/validate_knowledge.py
          python -m pytest specs/SPEC-00-fundamentos

      - name: SPEC-01 — Validar Questões, Unidades e Cálculo Simbólico (SymPy)
        run: |
          python specs/SPEC-01-questoes/validate_questions.py
          python -m pytest specs/SPEC-01-questoes

      - name: SPEC-02 — Validar Mecânica Pari-Mutuel de Risco Zero
        run: |
          python specs/SPEC-02-mecanica/validate_rules.py
          python -m pytest specs/SPEC-02-mecanica

      - name: SPEC-03 & SPEC-04 — Gerar e Testar Materiais Imprimíveis (001 a 023)
        run: |
          python specs/SPEC-03-gerador/deck_builder.py
          python -m pytest specs/SPEC-03-gerador
