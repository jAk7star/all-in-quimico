[project]
name = "all-in-quimico"
version = "1.0.0"
description = "All-In Químico: Jogo didático de Química para o Ensino Médio baseado em duelo de apostas A ou B (Pari-Mutuel de Risco Zero), concepções alternativas e validação científica simbólica (SymPy + Pydantic)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Jaques Gabriel Amaral", email = "jaquesgabrielamaral@gmail.com"}
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "sympy>=1.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = [
    "specs/SPEC-01-questoes/tests",
    "specs/SPEC-02-mecanica/tests",
    "specs/SPEC-03-gerador",
]
