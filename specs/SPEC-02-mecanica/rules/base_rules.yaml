version: 2
currency_name: "Tokens"
initial_budget: 1000

pari_mutuel:
  enabled: true
  options: ["A", "B"]
  betting_protocol: "simultaneous_blind"
  house_cut: 0.0
  recommended_house_cut_min: 0.0
  recommended_house_cut_max: 0.15
  min_winning_odd: 1.00
  zero_winners_policy: "rollover_pool"
  breakage_unit: 50
  denominations: [50, 100, 500]
  loser_loss_fraction: 1.0
  self_sustaining_house: true

bidding:
  min_bid: 50
  max_bid_phases_1_2: 500
  phase_3_all_in_allowed: true
  bid_increment: 50
  hit_multiplier: null
  miss_multiplier: -1.0
  pass_allowed: false

bonuses:
  scientific_justification_bonus: 50
  house_funded_rebuy_only: true
  steal_points: 0

blocks:
  - name: "Fase 1 - Aquecimento"
    difficulty_level: 1
    question_count: 13
    max_bid: 500
    special_rules: "Professor anuncia o Tema e lê a questão (A ou B). Apostas simultâneas fechadas (Mín: 50 T$, Máx: 500 T$). Sem comissão: 100% do pote vai para os vencedores (troco < 50 T$ fica na Casa)."
  - name: "Fase 2 - Rodadas Finais"
    difficulty_level: 2
    question_count: 7
    max_bid: 500
    special_rules: "Questões com armadilhas conceituais e comparação de casos. Apostas simultâneas (Mín: 50 T$, Máx: 500 T$). Sem comissão; troco em múltiplos de 50 T$ a favor da Casa."
  - name: "Fase 3 - Morte Súbita (Texas Hold'em Químico)"
    difficulty_level: 3
    question_count: 5
    max_bid: null
    special_rules: "1º Passo (No Escuro): Professor anuncia só o TEMA e equipes apostam mín. 100 T$. 2º Passo (Showdown): Após ler a questão, equipes escolhem A ou B e decidem Check (manter) ou Raise / All-in (aumentar)."

round_flow:
  - "0. Rodada-Treino (0 T$): Antes do jogo valendo, joga-se 1 rodada simulada para todos dominarem a conta do pote."
  - "1. Anúncio do Tema + Pergunta (A ou B): Na Fase 3, anuncia-se só o Tema primeiro para a Aposta no Escuro (mín. 100 T$) e depois lê-se a questão para Check ou Raise."
  - "2. Apostas Simultâneas (Fechadas): Equipes escolhem secretamente a placa A ou B e separam seus Tokens (múltiplos de 50 T$), revelando juntas ao sinal do professor."
  - "3. Cálculo do Multiplicador (Sem Comissão): Soma-se o Pote Total P = T_A + T_B + P_acumulado. O multiplicador da alternativa certa é O = P / T_certa."
  - "4. Revelação e Explicação Científica: O professor revela o gabarito (A ou B) e explica o conceito químico e a armadilha do distrator."
  - "5. Pagamento aos Vencedores: Quem acertou recebe floor((Aposta × O) / 50) × 50 Tokens (sempre >= Aposta)."
  - "6. Perda dos Perdedores e Troco da Casa: Quem errou perde 100% do que apostou. A sobra indivisível (< 50 T$) fica no Caixa da Casa. Se ninguém acertar, P acumula (Jackpot) para a próxima rodada."
  - "7. Repescagem e Vitória: Equipe zerada (0 T$) ganha +50 T$ do Caixa da Casa se explicar uma questão. Vence quem tiver mais Tokens ao final; empate no 1º lugar é decidido em Morte Súbita com All-in Automático e Duelo Oral Relâmpago."

tiebreaker: "sudden_death"
