    difficulty: 1
    concept_refs: [CHEM-ENV-GREENHOUSE]
    statement: "A queima em larga escala de combustíveis fósseis derivados do petróleo e carvão libera à atmosfera prioritariamente qual gás causador do efeito estufa antropogênico?"
    options:
      - {key: A, text: "Dióxido de carbono (CO₂).", rationale: "Correta; o CO₂ é o principal gás liberado na combustão de compostos carbônicos."}
      - {key: B, text: "Gás nitrogênio (N₂).", rationale: "O N₂ compõe a maior parte do ar, mas não é produto direto de combustão de carbono."}
    correct: A
