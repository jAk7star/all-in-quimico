  - id: Q-SOL-011
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-SOL
    skill: Identificar soluto e solvente em uma solução aquosa.
    cognitive_level: understanding
    difficulty: 1
    concept_refs: [CHEM-SOL-001]
    statement: "Em uma solução salina preparada pela dissolução completa de 5 g de sal em 100 mL de água líquida, a água desempenha a função de:"
    options:
      - {key: A, text: "Solvente, pois atua como meio dispersante que dissolve o soluto.", rationale: "Correta; o solvente dissolve o soluto na solução."}
      - {key: B, text: "Soluto, pois se encontra em estado líquido homogêneo.", rationale: "Confundiu solvente com soluto."}
    correct: A
    worked_solution: "A água é o dispersante líquido, caracterizando o solvente da mistura homogênea."
    scientific_justification: "Em soluções aquosas, a água atua tipicamente como solvente e o sal como soluto."

  - id: Q-STO-009
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-STO
    skill: Calcular quantidade de matéria a partir da massa e da massa molar fornecida.
    cognitive_level: application
    difficulty: 1
    concept_refs: [CHEM-STO-AMOUNT]
    formula_refs: [CHEM-FRM-003]
    statement: "Uma amostra pura de água (H2O) possui massa de 90 g. Sabendo que a massa molar da água é M(H2O) = 18 g/mol, calcule a quantidade de matéria, em mol."
    given_data:
      massa_amostra: {value: 90, unit: g}
      massa_molar: {value: 18, unit: g/mol, description: massa molar da água}
    calc:
      id: quantidade
      kind: formula
