  - id: Q-STO-010
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-STO
    skill: Aplicar o princípio de conservação das massas em reações fechadas.
    cognitive_level: understanding
    difficulty: 1
    concept_refs: [CHEM-STO-BALANCING]
    statement: "Em um recipiente fechado, 12 g de carbono reagem completamente com 32 g de gás oxigênio produzindo gás carbônico. De acordo com a Lei de Lavoisier, qual é a massa total de CO2 obtida?"
    options:
      - {key: A, text: "44 g de gás carbônico.", rationale: "Correta; 12 g + 32 g = 44 g (conservação total de massa)."}
      - {key: B, text: "20 g de gás carbônico.", rationale: "Subtraiu as massas dos reagentes em vez de somá-las."}
    correct: A
    worked_solution: "Massa dos produtos = massa dos reagentes = 12 g + 32 g = 44 g."
    scientific_justification: "Em sistema fechado, a soma das massas dos reagentes é rigorosamente igual à soma das massas dos produtos."

