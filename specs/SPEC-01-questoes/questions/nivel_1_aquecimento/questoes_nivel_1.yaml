# Questões de Nível 1 (Fase 1: Aquecimento)
questions:
  - id: Q-SOL-001
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-SOL
    skill: Calcular a concentração comum a partir da massa do soluto e do volume final da solução.
    cognitive_level: application
    difficulty: 1
    concept_refs: [CHEM-SOL-001]
    formula_refs: [CHEM-FRM-001]
    statement: >-
      Uma solução foi preparada dissolvendo 10 g de soluto em água até completar
      2 L de solução. Calcule a concentração comum, em g/L.
    given_data:
      massa_soluto: {value: 10, unit: g}
      volume_solucao: {value: 2, unit: L, description: volume final da solução}
    calc:
      id: concentracao
      kind: formula
      formula_ref: CHEM-FRM-001
      target: C
      inputs: {m_soluto: massa_soluto, V_solucao: volume_solucao}
      expected: {value: 5, unit: g/L, tolerance: 0.01}
    options:
      - {key: A, text: "5,0 g/L", rationale: "Correta; C = m / V = 10 g / 2 L = 5,0 g/L."}
      - {key: B, text: "20,0 g/L", rationale: "Multiplicou a massa pelo volume (10 × 2) em vez de dividir."}
    correct: A
    worked_solution: "C = m / V = 10 g / 2 L = 5 g/L."
    scientific_justification: A concentração comum relaciona a massa do soluto ao volume final da solução.

  - id: Q-SOL-006
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-SOL
    skill: Identificar o volume correto na concentração comum.
    cognitive_level: understanding
    difficulty: 1
    concept_refs: [CHEM-SOL-001]
    statement: Ao calcular a concentração comum de uma solução, qual volume deve ser usado?
    options:
      - {key: A, text: "O volume do solvente adicionado.", rationale: "Ignora o volume ocupado pelo soluto.",
         mistake_ref: {concept: CHEM-SOL-001, index: 1}}
      - {key: B, text: "O volume final da solução.", rationale: "Correta; é o volume que aparece na definição."}
    correct: B
    worked_solution: A concentração comum é a massa do soluto dividida pelo volume final da solução.
    scientific_justification: Definição de concentração comum, C = m_soluto / V_solucao.

  - id: Q-STO-001
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-STO
    skill: Calcular quantidade de matéria a partir da massa e da massa molar fornecida.
    cognitive_level: application
    difficulty: 1
    concept_refs: [CHEM-STO-AMOUNT]
    formula_refs: [CHEM-FRM-003]
    statement: >-
      Uma amostra pura de NaCl tem massa de 117 g. Sabendo que a massa molar do
      NaCl é 58,5 g/mol, calcule a quantidade de matéria, em mol.
    given_data:
      massa_amostra: {value: 117, unit: g}
      massa_molar: {value: 58.5, unit: g/mol, description: massa molar do NaCl}
    calc:
      id: quantidade
      kind: formula
      formula_ref: CHEM-FRM-003
      target: n
      inputs: {m: massa_amostra, M: massa_molar}
      expected: {value: 2.0, unit: mol, tolerance: 0.01}
    options:
      - {key: A, text: "0,50 mol", rationale: "Inverteu a razão dividindo a massa molar pela massa (58,5 / 117)."}
      - {key: B, text: "2,0 mol", rationale: "Correta; n = m / M = 117 g / 58,5 g/mol = 2,0 mol."}
    correct: B
    worked_solution: "n = m / M = 117 g / 58,5 g/mol = 2,0 mol."
    scientific_justification: Para substância pura, n = m / M.

  - id: Q-STO-002
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-STO
    skill: Calcular quantidade de matéria usando a massa atômica fornecida.
    cognitive_level: application
    difficulty: 1
    concept_refs: [CHEM-STO-AMOUNT]
    formula_refs: [CHEM-FRM-003]
    statement: >-
      Qual a quantidade de matéria, em mol, em 9,2 g de sódio metálico?
      Dado: massa molar do Na = 23,0 g/mol.
    given_data:
      massa_amostra: {value: 9.2, unit: g}
      massa_na: {value: 23.0, unit: g/mol, element_ref: CHEM-ELE-011}
    calc:
      id: quantidade
      kind: formula
      formula_ref: CHEM-FRM-003
      target: n
      inputs: {m: massa_amostra, M: massa_na}
      expected: {value: 0.40, unit: mol, tolerance: 0.01}
    options:
      - {key: A, text: "0,40 mol", rationale: "Correta; n = 9,2 g / 23,0 g/mol = 0,40 mol."}
      - {key: B, text: "2,50 mol", rationale: "Dividiu a massa molar pela massa da amostra (23,0 / 9,2)."}
    correct: A
    worked_solution: "n = 9,2 g / 23,0 g/mol = 0,40 mol."
    scientific_justification: Amostra de elemento puro; n = m / M com a massa molar adotada.

  - id: Q-STO-003
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-STO
    skill: Distinguir coeficientes estequiométricos de índices.
    cognitive_level: understanding
    difficulty: 1
    concept_refs: [CHEM-STO-001]
    statement: >-
      Na equação balanceada 2 H<sub>2</sub> + O<sub>2</sub> → 2 H<sub>2</sub>O, o que expressa a proporção entre
      as quantidades de matéria das espécies?
    options:
      - {key: A, text: "Os coeficientes estequiométricos da equação balanceada.", rationale: "Correta; 2 mol H2 : 1 mol O2 : 2 mol H2O."}
      - {key: B, text: "Os índices das fórmulas (2, 2 e 1 nas fórmulas).", rationale: "Índices indicam átomos na fórmula, não proporção da reação.",
         mistake_ref: {concept: CHEM-STO-001, index: 0}}
    correct: A
    worked_solution: "Os coeficientes de uma equação balanceada dão a proporção em quantidade de matéria (2 mol H<sub>2</sub> : 1 mol O<sub>2</sub> : 2 mol H<sub>2</sub>O)."
    scientific_justification: Definição de proporção estequiométrica.

  - id: Q-ATO-001
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-ATO
    skill: Identificar o critério de organização da Tabela Periódica moderna.
    cognitive_level: recognition
    difficulty: 1
    concept_refs: [CHEM-ATO-TABLE]
    statement: "Como os elementos químicos estão dispostos na Tabela Periódica moderna?"
    options:
      - {key: A, text: "Em ordem crescente de massa atômica.", rationale: "Critério antigo de Mendeleev.", mistake_ref: {concept: CHEM-ATO-TABLE, index: 0}}
      - {key: B, text: "Em ordem crescente de número atômico (Z).", rationale: "Correta; ordenados pelo número de prótons."}
    correct: B
    worked_solution: "A Tabela Periódica moderna é disposta em ordem crescente de número atômico (Z)."
    scientific_justification: "Lei da periodicidade de Moseley."

  - id: Q-ATO-002
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-ATO
    skill: Diferenciar períodos e famílias na Tabela Periódica.
    cognitive_level: recognition
    difficulty: 1
    concept_refs: [CHEM-ATO-TABLE]
    statement: "Na Tabela Periódica, o que representam as colunas verticais?"
    options:
      - {key: A, text: "Períodos com o mesmo número de camadas eletrônicas.", rationale: "Linhas horizontais são os períodos.", mistake_ref: {concept: CHEM-ATO-TABLE, index: 1}}
      - {key: B, text: "Grupos ou Famílias com propriedades químicas semelhantes.", rationale: "Correta; colunas agrupam famílias."}
    correct: B
    worked_solution: "As colunas verticais correspondem às Famílias ou Grupos."
    scientific_justification: "Elementos da mesma família possuem configuração semelhante na camada de valência."

  - id: Q-STO-004
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-STO
    skill: Calcular a massa molar da água (H2O).
    cognitive_level: application
    difficulty: 1
    concept_refs: [CHEM-STO-MOLARMASS]
    given_data:
      massa_h: {value: 1.0, unit: g/mol, element_ref: CHEM-ELE-001}
      massa_o: {value: 16.0, unit: g/mol, element_ref: CHEM-ELE-008}
    statement: "Calcule a massa molar da água (H<sub>2</sub>O), em g/mol. Dados: M<sub>H</sub> = 1,0 g/mol, M<sub>O</sub> = 16,0 g/mol."
    calc:
      id: massa_molar_h2o
      kind: molar_mass
      composition: {CHEM-ELE-001: 2, CHEM-ELE-008: 1}
      expected: {value: 18.0, unit: g/mol, tolerance: 0.01}
    options:
      - {key: A, text: "18,0 g/mol", rationale: "Correta; M(H2O) = 2 × 1,0 + 16,0 = 18,0 g/mol."}
      - {key: B, text: "17,0 g/mol", rationale: "Somou apenas 1 átomo de hidrogênio, ignorando o índice 2 em H2O.", mistake_ref: {concept: CHEM-STO-MOLARMASS, index: 0}}
    correct: A
    worked_solution: "M(H<sub>2</sub>O) = 2 × 1,0 + 16,0 = 18,0 g/mol."
    scientific_justification: "Soma ponderada das massas atômicas dos átomos de H e O."

  - id: Q-STO-005
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-STO
    skill: Calcular a massa de uma amostra a partir do número de mols.
    cognitive_level: application
    difficulty: 1
    concept_refs: [CHEM-STO-AMOUNT]
    formula_refs: [CHEM-FRM-003]
    given_data:
      n_mols: {value: 3.0, unit: mol}
      massa_molar_h2o: {value: 18.0, unit: g/mol}
    statement: "Qual a massa em gramas de uma amostra de 3,0 mol de água (H<sub>2</sub>O)? Dado: M<sub>H<sub>2</sub>O</sub> = 18,0 g/mol."
    calc:
      id: massa_amostra
      kind: formula
      formula_ref: CHEM-FRM-003
      target: m
      inputs: {n: n_mols, M: massa_molar_h2o}
      expected: {value: 54.0, unit: g, tolerance: 0.01}
    options:
      - {key: A, text: "6,0 g", rationale: "Dividiu a massa molar pelo número de mols (18,0 / 3,0) em vez de multiplicar."}
      - {key: B, text: "54,0 g", rationale: "Correta; m = n × M = 3,0 mol × 18,0 g/mol = 54,0 g."}
    correct: B
    worked_solution: "m = n × M = 3,0 mol × 18,0 g/mol = 54,0 g."
    scientific_justification: "Fórmula da quantidade de matéria m = n × M."

  - id: Q-ENV-001
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-ENV
    skill: Identificar os gases poluentes responsáveis pela acidificação acentuada da chuva.
    cognitive_level: understanding
    difficulty: 1
    concept_refs: [CHEM-ENV-ACIDRAIN]
    statement: "A água da chuva em uma região limpa já é levemente ácida (pH ≈ 5,6) devido ao CO<sub>2</sub> natural do ar. Qual gás poluente industrial faz esse pH cair abaixo de 4,5, gerando a chuva ácida?"
    options:
      - {key: A, text: "Metano (CH<sub>4</sub>), que se dissolve nas nuvens formando ácido carbônico concentrado.", rationale: "Confunde um gás do efeito estufa (CH4, apolar e pouco solúvel) com os óxidos ácidos formadores de chuva ácida.", mistake_ref: {concept: CHEM-ENV-ACIDRAIN, index: 0}}
      - {key: B, text: "Dióxido de enxofre (SO<sub>2</sub>), que se oxida na atmosfera formando ácido sulfúrico (H<sub>2</sub>SO<sub>4</sub>).", rationale: "Correta; óxidos de enxofre e nitrogênio reagem com a água gerando ácidos fortes."}
    correct: B
    worked_solution: "Enquanto o CO<sub>2</sub> forma um ácido fraco (H<sub>2</sub>CO<sub>3</sub>, pH ≈ 5,6), o SO<sub>2</sub> gera H<sub>2</sub>SO<sub>3</sub> e H<sub>2</sub>SO<sub>4</sub>, ácidos muito mais fortes."
    scientific_justification: "SO<sub>2</sub> + ½ O<sub>2</sub> + H<sub>2</sub>O → H<sub>2</sub>SO<sub>4</sub> (chuva ácida antrópica)."

  - id: Q-ENV-002
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-ENV
    skill: Distinguir o mecanismo físico-químico do efeito estufa da destruição da camada de ozônio.
    cognitive_level: understanding
    difficulty: 1
    concept_refs: [CHEM-ENV-GREENHOUSE]
    statement: "Muitas pessoas confundem o efeito estufa com o buraco na camada de ozônio. Qual é o verdadeiro mecanismo físico-químico do efeito estufa na atmosfera?"
    options:
      - {key: A, text: "Gases CFCs abrem falhas na camada de ozônio, deixando entrar mais calor solar direto na superfície.", rationale: "Confunde a filtragem de radiação UV pela camada de ozônio com a retenção de infravermelho do efeito estufa.", mistake_ref: {concept: CHEM-ENV-GREENHOUSE, index: 0}}
      - {key: B, text: "Gases como CO<sub>2</sub>, CH<sub>4</sub> e vapor d'água deixam passar a luz visível, mas absorvem o calor (infravermelho) reemitido pela Terra.", rationale: "Correta; as moléculas de gases estufa vibram ao absorver radiação infravermelha, mantendo o planeta aquecido."}
    correct: B
    worked_solution: "A luz solar atravessa a atmosfera e aquece a superfície, que emite radiação infravermelha (calor) retida por CO<sub>2</sub>, CH<sub>4</sub> e H<sub>2</sub>O."
    scientific_justification: "Absorção seletiva de radiação térmica infravermelha por modos vibracionais moleculares."

  - id: Q-ENV-003
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-ENV
    skill: Reconhecer a natureza dinâmica do equilíbrio biogeoquímico em ecossistemas maduros.
    cognitive_level: understanding
    difficulty: 1
    concept_refs: [CHEM-ENV-EQUILIBRIUM]
    statement: "Em uma floresta madura em equilíbrio ecológico (clímax), o que ocorre com o balanço entre o O<sub>2</sub> produzido na fotossíntese e o O<sub>2</sub> consumido na respiração ao longo do ano?"
    options:
      - {key: A, text: "As velocidades de produção (fotossíntese) e consumo (respiração e decomposição) praticamente se igualam em equilíbrio dinâmico.", rationale: "Correta; as reações continuam ocorrendo intensamente, mas com taxas equivalentes no ciclo biogeoquímico."}
      - {key: B, text: "As reações de decomposição cessam na mata adulta, acumulando apenas O<sub>2</sub> puro sem emissão de CO<sub>2</sub>.", rationale: "Considera equivocadamente que equilíbrio ambiental significa interrupção de processos de respiração e decomposição.", mistake_ref: {concept: CHEM-ENV-EQUILIBRIUM, index: 0}}
    correct: A
    worked_solution: "Em um ecossistema em clímax, quase todo o O<sub>2</sub> gerado na fotossíntese é consumido pela respiração da própria biota e dos decompositores."
    scientific_justification: "Equilíbrio dinâmico nos ciclos biogeoquímicos do carbono e do oxigênio."

  - id: Q-ENV-004
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-ENV
    skill: Explicar por que a reciclagem do alumínio economiza 95% de energia elétrica frente à bauxita.
    cognitive_level: understanding
    difficulty: 1
    concept_refs: [CHEM-ENV-SOCIOECON]
    statement: "Reciclar latinhas de alumínio economiza cerca de 95% da energia elétrica necessária para produzir o metal a partir do minério bauxita (Al<sub>2</sub>O<sub>3</sub>). Qual é a razão química dessa enorme diferença?"
    options:
      - {key: A, text: "Na bauxita é preciso romper ligações químicas por eletrólise ígnea (Al<sup>3+</sup> → Al<sup>0</sup>), enquanto na reciclagem basta fundir o metal já reduzido.", rationale: "Correta; a redução eletroquímica do cátion Al3+ consome imensa quantidade de energia elétrica."}
      - {key: B, text: "A reciclagem dispensa o aquecimento térmico em forno, pois o alumínio das latas é dissolvido a frio em água pura.", rationale: "Ignora que a reciclagem funde o alumínio a ~660 °C e subestima o custo eletroquímico real da metalurgia primária.", mistake_ref: {concept: CHEM-ENV-SOCIOECON, index: 0}}
    correct: A
    worked_solution: "Fundir o alumínio metálico (660 °C) gasta apenas ~5% da energia exigida pela eletrólise ígnea do óxido de alumínio (processo Hall-Héroult)."
    scientific_justification: "Custo energético da redução eletrolítica vs. entalpia de fusão física do metal."
