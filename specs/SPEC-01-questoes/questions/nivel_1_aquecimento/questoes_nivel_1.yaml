      target: n
      inputs: {m: massa_amostra, M: massa_molar}
      expected: {value: 5.0, unit: mol, tolerance: 0.01}
    options:
      - {key: A, text: "5,0 mol", rationale: "Correta; n = m / M = 90 g / 18 g/mol = 5,0 mol."}
