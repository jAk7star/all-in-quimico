# Questões de Nível 2 (Fase 2: Rodadas Finais 5 a 8 e Médio Aprofundamento)
questions:
  - id: Q-SOL-002
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-SOL
    skill: Calcular a concentração comum convertendo o volume de mL para L e comparando soluções.
    cognitive_level: application
    difficulty: 2
    concept_refs: [CHEM-SOL-001, CHEM-UNT-CONVERSION]
    formula_refs: [CHEM-FRM-001]
    statement: >-
      Um técnico preparou dois frascos de soro: o Frasco I tem 4,0 g de sal em
      500 mL de solução; o Frasco II tem 12,0 g do mesmo sal em 2,0 L de solução.
      Qual é a concentração comum do Frasco I e qual frasco é mais concentrado?
    given_data:
      massa_soluto: {value: 4.0, unit: g}
      volume_solucao: {value: 500, unit: mL, description: volume final do Frasco I}
    calc:
      id: concentracao
      kind: formula
      formula_ref: CHEM-FRM-001
      target: C
      inputs: {m_soluto: massa_soluto, V_solucao: volume_solucao}
      expected: {value: 8.0, unit: g/L, tolerance: 0.01}
    options:
      - {key: A, text: "Frasco I tem 4,0 g/L; portanto o Frasco II (6,0 g/L) é mais concentrado.", rationale: "Esqueceu de converter 500 mL para 0,500 L ou julgou apenas pela maior massa absoluta (12 g).", mistake_ref: {concept: CHEM-SOL-001, index: 0}}
      - {key: B, text: "Frasco I tem 8,0 g/L; portanto é mais concentrado que o Frasco II (6,0 g/L).", rationale: "Correta; 500 mL = 0,500 L, logo C_I = 4,0 / 0,500 = 8,0 g/L, superando C_II = 12,0 / 2,0 = 6,0 g/L."}
    correct: B
    worked_solution: "Frasco I: 500 mL = 0,500 L → C = 4,0 g / 0,500 L = 8,0 g/L. Frasco II: C = 12,0 g / 2,0 L = 6,0 g/L. O Frasco I é mais concentrado."
    scientific_justification: A concentração depende da razão m/V em litros, não apenas da massa total de soluto.

  - id: Q-SOL-003
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-SOL
    skill: Calcular a concentração em quantidade de matéria e avaliar sua propriedade intensiva.
    cognitive_level: application
    difficulty: 2
    concept_refs: [CHEM-SOL-002]
    formula_refs: [CHEM-FRM-002]
    statement: >-
      Uma solução aquosa contém 0,50 mol de glicose em 250 mL de volume final.
      Se retirarmos uma alíquota de apenas 50 mL dessa solução para um tubo de
      ensaio, qual é a molaridade da solução original e a da alíquota retirada?
    given_data:
      quantidade_soluto: {value: 0.50, unit: mol}
      volume_solucao: {value: 250, unit: mL, description: volume final da solução}
    calc:
      id: molaridade
      kind: formula
      formula_ref: CHEM-FRM-002
      target: c
      inputs: {n_soluto: quantidade_soluto, V_solucao: volume_solucao}
      expected: {value: 2.0, unit: mol/L, tolerance: 0.01}
    options:
      - {key: A, text: "2,0 mol/L em ambas, pois a concentração é uma propriedade intensiva que não muda ao transferir parte da solução.", rationale: "Correta; c = 0,50 mol / 0,250 L = 2,0 mol/L tanto no frasco original quanto na alíquota de 50 mL."}
      - {key: B, text: "2,0 mol/L no frasco original, mas cai para 0,40 mol/L no tubo por ter volume 5 vezes menor.", rationale: "Confunde quantidade de matéria (extensiva) com concentração molar (intensiva).", mistake_ref: {concept: CHEM-SOL-002, index: 0}}
    correct: A
    worked_solution: "250 mL = 0,250 L; c = 0,50 mol / 0,250 L = 2,0 mol/L. Qualquer porção retirada mantém a mesma concentração de 2,0 mol/L."
    scientific_justification: A concentração em quantidade de matéria é uma grandeza intensiva (razão n/V constante em toda a solução homogênea).

  - id: Q-SOL-004
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-SOL
    skill: Calcular a concentração final de uma diluição distinguindo água adicionada de volume final.
    cognitive_level: application
    difficulty: 2
    concept_refs: [CHEM-SOL-003]
    formula_refs: [CHEM-FRM-004]
    statement: >-
      A 100 mL de uma solução 2,0 mol/L, um estudante adicionou 300 mL de água
      destilada, totalizando 400 mL de solução final. Qual é a concentração
      molar final após a diluição?
    given_data:
      c_inicial: {value: 2.0, unit: mol/L}
      v_inicial: {value: 100, unit: mL}
      v_final: {value: 400, unit: mL, description: volume final após a diluição}
    assumptions: [O soluto é a mesma espécie antes e depois da diluição, sem reação com o solvente.]
    calc:
      id: c_final
      kind: formula
      formula_ref: CHEM-FRM-004
      target: c2
      inputs: {c1: c_inicial, V1: v_inicial, V2: v_final}
      expected: {value: 0.50, unit: mol/L, tolerance: 0.01}
    options:
      - {key: A, text: "0,50 mol/L (calculada sobre o volume final total de 400 mL).", rationale: "Correta; c1·V1 = c2·V2 → c2 = (2,0 × 100) / 400 = 0,50 mol/L."}
      - {key: B, text: "0,67 mol/L (calculada sobre os 300 mL de água adicionados).", rationale: "Usou o volume de água adicionado (300 mL) como V2 em vez do volume final total (400 mL).", mistake_ref: {concept: CHEM-SOL-003, index: 1}}
    correct: A
    worked_solution: "V_final = 100 mL + 300 mL = 400 mL. Pela conservação do soluto: c2 = (2,0 × 100) / 400 = 0,50 mol/L."
    scientific_justification: Na equação da diluição c1·V1 = c2·V2, V2 é sempre o volume final total da solução.

  - id: Q-SOL-009
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-SOL
    skill: Determinar a concentração resultante ao misturar volumes diferentes de soluções de mesmo soluto.
    cognitive_level: application
    difficulty: 2
    concept_refs: [CHEM-SOL-MIX]
    statement: "Misturam-se 100 mL de solução de NaCl 1,0 mol/L com 300 mL de outra solução de NaCl 3,0 mol/L. Qual é a concentração molar final dos 400 mL de mistura?"
    options:
      - {key: A, text: "2,0 mol/L, pois é a média aritmética simples entre 1,0 mol/L e 3,0 mol/L.", rationale: "Fez a média simples sem ponderar que o volume da solução de 3,0 mol/L é o triplo da primeira.", mistake_ref: {concept: CHEM-SOL-MIX, index: 0}}
      - {key: B, text: "2,5 mol/L, pois a solução mais concentrada entrou em volume três vezes maior.", rationale: "Correta; n_total = (1,0 × 0,100) + (3,0 × 0,300) = 0,10 + 0,90 = 1,0 mol em 0,400 L → c = 1,0 / 0,400 = 2,5 mol/L."}
    correct: B
    worked_solution: "n1 = 1,0 × 0,1 = 0,1 mol; n2 = 3,0 × 0,3 = 0,9 mol; n_total = 1,0 mol em V_total = 0,4 L → c_final = 1,0 / 0,4 = 2,5 mol/L."
    scientific_justification: "Com volumes diferentes, a concentração final é a média ponderada pelos volumes (soma dos mols dividida pelo volume total)."

  - id: Q-STO-006
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-STO
    skill: Identificar o reagente limitante em uma reação de proporção 1:2 mol.
    cognitive_level: application
    difficulty: 2
    concept_refs: [CHEM-STO-LIMITING]
    statement: "Na neutralização H<sub>2</sub>SO<sub>4</sub> + 2 NaOH → Na<sub>2</sub>SO<sub>4</sub> + 2 H<sub>2</sub>O, misturam-se 2,0 mol de H<sub>2</sub>SO<sub>4</sub> com 3,0 mol de NaOH. Qual é o reagente limitante da reação?"
    options:
      - {key: A, text: "O H<sub>2</sub>SO<sub>4</sub> é o limitante, porque está em menor quantidade inicial (2,0 mol contra 3,0 mol).", rationale: "Olhou apenas para o menor número absoluto de mols sem considerar a proporção estequiométrica 1:2.", mistake_ref: {concept: CHEM-STO-LIMITING, index: 0}}
      - {key: B, text: "O NaOH é o limitante, pois 2,0 mol de H<sub>2</sub>SO<sub>4</sub> exigiriam 4,0 mol de NaOH para reagir totalmente.", rationale: "Correta; cada 1 mol de ácido exige 2 mol de base, então 3,0 mol de NaOH consomem apenas 1,5 mol de H2SO4 (sobrando 0,5 mol de ácido)."}
    correct: B
    worked_solution: "Proporção 1 H<sub>2</sub>SO<sub>4</sub> : 2 NaOH. Os 3,0 mol de NaOH reagem com apenas 1,5 mol de H<sub>2</sub>SO<sub>4</sub>. Logo, o NaOH acaba primeiro (limitante) e sobram 0,5 mol de H<sub>2</sub>SO<sub>4</sub>."
    scientific_justification: "O reagente limitante é determinado pela menor razão (quantidade disponível / coeficiente estequiométrico)."

  - id: Q-ENV-005
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-ENV
    skill: Explicar o mecanismo químico e a função ambiental dos conversores catalíticos automotivos.
    cognitive_level: application
    difficulty: 2
    concept_refs: [CHEM-ENV-CATALYTIC]
    statement: "O catalisador do escapamento automotivo transforma o monóxido de carbono (CO) em dióxido de carbono (CO<sub>2</sub>). Se o CO<sub>2</sub> é um gás estufa, por que essa conversão ainda é indispensável e como o catalisador atua?"
    options:
      - {key: A, text: "Porque o CO é um gás letal por asfixia química imediata, e a colmeia metálica acelera sua oxidação a CO<sub>2</sub> sem ser consumida.", rationale: "Correta; o CO liga-se irreversivelmente à hemoglobina, e o catalisador reduz a energia de ativação sem se gastar."}
      - {key: B, text: "Porque o catalisador funciona como uma esponja química que é consumida ao reter o carbono sólido dentro do escapamento.", rationale: "Acredita equivocadamente que catalisadores são filtros mecânicos consumidos durante a reação.", mistake_ref: {concept: CHEM-ENV-CATALYTIC, index: 0}}
    correct: A
    worked_solution: "2 CO + O<sub>2</sub> → 2 CO<sub>2</sub>. O catalisador heterogêneo (Pt/Pd/Rh) fornece um caminho de menor energia de ativação e regenera-se ao final de cada ciclo."
    scientific_justification: "Catálise heterogênea na conversão de gases altamente tóxicos (CO e NOx) em gases menos nocivos à saúde aguda."

  - id: Q-STO-007
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-STO
    skill: Calcular o rendimento real e planejar a quantidade teórica necessária em processos químicos.
    cognitive_level: application
    difficulty: 2
    concept_refs: [CHEM-STO-YIELD]
    statement: "Uma reação industrial opera com rendimento de 80%. Para entregar uma encomenda real de 8,0 mol de produto, a equipe colocou reagente limitante suficiente para formar 10,0 mol teóricos (com o outro reagente em excesso de 15,0 mol). Quantos mols reais serão obtidos?"
    options:
      - {key: A, text: "12,0 mol, pois os 80% de rendimento devem ser calculados sobre os 15,0 mol do reagente em excesso.", rationale: "Calculou o rendimento sobre a quantidade do reagente em excesso em vez do limitante.", mistake_ref: {concept: CHEM-STO-YIELD, index: 0}}
      - {key: B, text: "8,0 mol, pois o rendimento de 80% incide exclusivamente sobre os 10,0 mol teóricos definidos pelo reagente limitante.", rationale: "Correta; n_real = 0,80 × 10,0 mol = 8,0 mol."}
    correct: B
    worked_solution: "O rendimento percentual incide sempre sobre a produção teórica máxima dada pelo reagente limitante: 80% de 10,0 mol = 8,0 mol."
    scientific_justification: "Rendimento real = Rendimento (%) × Quantidade Teórica (baseada no limitante)."

  - id: Q-SOL-012
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-SOL
    skill: Calcular a concentração molar final após processo de diluição com água destilada.
    cognitive_level: application
    difficulty: 2
    concept_refs: [CHEM-SOL-003]
    formula_refs: [CHEM-FRM-004]
    statement: "Dispõe-se de 100 mL de uma solução aquosa de NaCl 1,0 mol/L. Adicionam-se 300 mL de água destilada, totalizando 400 mL de solução final. Qual é a concentração molar final, em mol/L?"
    given_data:
      c_inicial: {value: 1.0, unit: mol/L}
      v_inicial: {value: 0.1, unit: L}
      v_final: {value: 0.4, unit: L}
    calc:
      id: diluicao
      kind: formula
      formula_ref: CHEM-FRM-004
      target: c2
      inputs: {c1: c_inicial, V1: v_inicial, V2: v_final}
      expected: {value: 0.25, unit: mol/L, tolerance: 0.01}
    options:
      - {key: A, text: "0,25 mol/L", rationale: "Correta; c2 = c1 × V1 / V2 = 1,0 mol/L × 0,1 L / 0,4 L = 0,25 mol/L."}
      - {key: B, text: "0,33 mol/L", rationale: "Dividiu pelo volume de água adicionada (300 mL) em vez do volume total da solução final (400 mL)."}
    correct: A
    worked_solution: "c2 = (c1 × V1) / V2 = (1,0 mol/L × 0,1 L) / 0,4 L = 0,25 mol/L."
    scientific_justification: "Em diluições, a quantidade de matéria do soluto permanece constante (c1·V1 = c2·V2)."

  - id: Q-STO-011
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-STO
    skill: Determinar a massa de dióxido de carbono produzida na queima completa de carbono.
    cognitive_level: application
    difficulty: 2
    concept_refs: [CHEM-STO-MOLARMASS]
    statement: "Na combustão completa de 24 g de carbono puro (C + O2 → CO2), considerando M(C) = 12 g/mol e M(CO2) = 44 g/mol com rendimento de 100%, qual é a massa total de CO2 formada?"
    options:
      - {key: A, text: "88 g de CO2.", rationale: "Correta; 24 g de C = 2 mol de C, que produzem 2 mol de CO2 = 2 × 44 g/mol = 88 g."}
      - {key: B, text: "44 g de CO2.", rationale: "Considerou apenas 1 mol de produto em vez de calcular a proporção estequiométrica a partir dos 24 g de reagente."}
    correct: A
    worked_solution: "n(C) = 24 g / 12 g/mol = 2 mol. Pela estequiometria 1:1, formam-se 2 mol de CO2: m = 2 mol × 44 g/mol = 88 g."
    scientific_justification: "Proporção molar estequiométrica direta entre carbono consumido e dióxido de carbono produzido."

  - id: Q-STO-012
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-STO
    skill: Identificar o reagente limitante e calcular a quantidade em excesso.
    cognitive_level: application
    difficulty: 2
    concept_refs: [CHEM-STO-LIMITING]
    statement: "Misturam-se 2,0 mol de gás hidrogênio (H2) com 2,0 mol de gás oxigênio (O2) para reagirem segundo a equação 2 H2 + O2 → 2 H2O. Qual reagente é o limitante e quanto resta em excesso?"
    options:
      - {key: A, text: "O reagente limitante é o H2, e resta 1,0 mol de O2 em excesso.", rationale: "Correta; 2 mol de H2 consomem exatamente 1 mol de O2, restando 2 - 1 = 1 mol de O2 em excesso."}
      - {key: B, text: "O reagente limitante é o O2, e restam 2,0 mol de H2 em excesso.", rationale: "Inverteu os papéis dos reagentes na proporção estequiométrica 2:1."}
    correct: A
    worked_solution: "A proporção requer 2 mol de H2 para 1 mol de O2. Havendo 2 mol de cada, o H2 se esgota primeiro e sobra 1 mol de O2."
    scientific_justification: "O reagente que se esgota antes limita a extensão máxima da reação química."

  - id: Q-ENV-009
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-ENV
    skill: Explicar a gênese química da chuva ácida a partir da oxidação de óxidos de enxofre.
    cognitive_level: understanding
    difficulty: 2
    concept_refs: [CHEM-ENV-ACIDRAIN]
    statement: "O dióxido de enxofre (SO2) expelido em processos industriais é oxidado na atmosfera a trióxido de enxofre (SO3). Ao reagir com gotículas de água nas nuvens, esse gás forma principalmente:"
    options:
      - {key: A, text: "Ácido sulfúrico (H2SO4), promovendo acidificação intensa da precipitação pluvial.", rationale: "Correta; SO3 + H2O → H2SO4, um ácido diprótico forte."}
      - {key: B, text: "Gás sulfídrico (H2S), provocando odor fétido sem alterar o pH da água pluvial.", rationale: "O H2S é um gás de decomposição anaeróbia e não o produto de hidratação do trióxido de enxofre."}
    correct: A
    worked_solution: "SO3 (g) + H2O (l) → H2SO4 (aq). A hidratação do trióxido de enxofre gera ácido sulfúrico forte."
    scientific_justification: "A chuva ácida clássica tem no ácido sulfúrico um de seus principais componentes acidificantes."

  - id: Q-ENV-010
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-ENV
    skill: Analisar o papel de catalisadores automotivos na mitigação de poluentes tóxicos.
    cognitive_level: understanding
    difficulty: 2
    concept_refs: [CHEM-ENV-CATALYTIC]
    statement: "Nos escapamentos automotivos, conversores catalíticos à base de platina e ródio atuam convertendo os gases nocivos monóxido de carbono (CO) e óxidos de nitrogênio (NOx) em:"
    options:
      - {key: A, text: "Dióxido de carbono (CO2) e gás nitrogênio (N2), compostos de toxicidade reduzida.", rationale: "Correta; oxidação de CO a CO2 e redução de NOx a N2 inerte."}
      - {key: B, text: "Metano (CH4) e ácido nítrico (HNO3), gerando combustíveis limpos de escape.", rationale: "Conversores catalíticos automotivos não realizam metanação nem produzem ácido nítrico."}
    correct: A
    worked_solution: "2 CO + O2 → 2 CO2 (oxidação) e 2 NO → N2 + O2 (redução catalítica)."
    scientific_justification: "Catálise heterogênea metálica reduzindo a emissão de poluentes primários letais para espécies comuns da atmosfera."
