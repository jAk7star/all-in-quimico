# Questões de Nível 3 (Fase 3 / Desafio Morte Súbita - Desempate)
questions:
  - id: Q-SOL-005
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-SOL
    skill: Determinar o volume final necessário em uma diluição.
    cognitive_level: application
    difficulty: 3
    concept_refs: [CHEM-SOL-003]
    formula_refs: [CHEM-FRM-004]
    statement: >-
      Deseja-se obter uma solução 0,25 mol/L a partir de 50 mL de uma solução
      1,0 mol/L do mesmo soluto. Qual deve ser o volume final, em mL?
    given_data:
      c_inicial: {value: 1.0, unit: mol/L}
      v_inicial: {value: 50, unit: mL}
      c_final: {value: 0.25, unit: mol/L}
    assumptions: [O soluto é a mesma espécie antes e depois da diluição.]
    calc:
      id: v_final
      kind: formula
      formula_ref: CHEM-FRM-004
      target: V2
      inputs: {c1: c_inicial, V1: v_inicial, c2: c_final}
      expected: {value: 200, unit: mL, tolerance: 0.01}
    options:
      - {key: A, text: "200 mL", rationale: "Correta; V2 = (c1 · V1) / c2 = (1,0 × 50) / 0,25 = 200 mL."}
      - {key: B, text: "12,5 mL", rationale: "Multiplicou o volume inicial por 0,25 em vez de dividir pela concentração final."}
    correct: A
    worked_solution: "V2 = c1·V1 / c2 = 1,0 × 50 / 0,25 = 200 mL."
    scientific_justification: A conservação da quantidade de soluto permite determinar V2 quando as demais grandezas são dadas.

  - id: Q-SOL-007
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-SOL
    skill: Calcular a concentração em quantidade de matéria a partir da massa de um sal.
    cognitive_level: analysis
    difficulty: 3
    concept_refs: [CHEM-STO-MOLARMASS, CHEM-STO-AMOUNT, CHEM-SOL-002]
    formula_refs: [CHEM-FRM-003, CHEM-FRM-002]
    statement: >-
      11,7 g de NaCl foram dissolvidos em água até completar 500 mL de solução.
      Dados: massas atômicas M<sub>Na</sub> = 23,0 g/mol e M<sub>Cl</sub> = 35,5 g/mol.
      (a) Calcule a massa molar do NaCl. (b) Calcule a quantidade de matéria de
      NaCl. (c) Calcule a concentração em quantidade de matéria, em mol/L.
    given_data:
      massa_nacl: {value: 11.7, unit: g}
      volume_solucao: {value: 500, unit: mL, description: volume final da solução}
      massa_na: {value: 23.0, unit: g/mol, element_ref: CHEM-ELE-011}
      massa_cl: {value: 35.5, unit: g/mol, element_ref: CHEM-ELE-017}
    steps:
      - id: massa_molar
        kind: molar_mass
        prompt: Massa molar do NaCl.
        composition: {CHEM-ELE-011: 1, CHEM-ELE-017: 1}
        expected: {value: 58.5, unit: g/mol, tolerance: 0.01}
      - id: quantidade
        kind: formula
        prompt: Quantidade de matéria de NaCl.
        formula_ref: CHEM-FRM-003
        target: n
        inputs: {m: massa_nacl, M: massa_molar}
        expected: {value: 0.20, unit: mol, tolerance: 0.01}
      - id: molaridade
        kind: formula
        prompt: Concentração em quantidade de matéria.
        formula_ref: CHEM-FRM-002
        target: c
        inputs: {n_soluto: quantidade, V_solucao: volume_solucao}
        expected: {value: 0.40, unit: mol/L, tolerance: 0.01}
    options:
      - {key: A, text: "M = 58,5 g/mol • n = 0,20 mol • c = 0,40 mol/L", rationale: "Correta; converteu 500 mL para 0,500 L para achar c = 0,20 / 0,500 = 0,40 mol/L."}
      - {key: B, text: "M = 58,5 g/mol • n = 0,20 mol • c = 0,20 mol/L", rationale: "Esqueceu de dividir a quantidade de matéria pelo volume de 0,500 L na última etapa."}
    correct: A
    worked_solution: >-
      M = 23,0 + 35,5 = 58,5 g/mol; n = 11,7 / 58,5 = 0,20 mol;
      c = 0,20 mol / 0,500 L = 0,40 mol/L.
    scientific_justification: Encadeia massa molar, n = m/M e c = n/V, com volume final em litros.

  - id: Q-SOL-008
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-SOL
    skill: Calcular a concentração em quantidade de matéria do NaOH a partir de sua massa.
    cognitive_level: analysis
    difficulty: 3
    concept_refs: [CHEM-STO-MOLARMASS, CHEM-STO-AMOUNT, CHEM-SOL-002]
    formula_refs: [CHEM-FRM-003, CHEM-FRM-002]
    statement: >-
      8,0 g de NaOH foram dissolvidos em água até completar 250 mL de solução.
      Dados: M<sub>Na</sub> = 23,0 g/mol, M<sub>O</sub> = 16,0 g/mol e M<sub>H</sub> = 1,0 g/mol.
      (a) Calcule a massa molar do NaOH. (b) Calcule a quantidade de matéria.
      (c) Calcule a concentração em mol/L.
    given_data:
      massa_naoh: {value: 8.0, unit: g}
      volume_solucao: {value: 250, unit: mL, description: volume final da solução}
      massa_na: {value: 23.0, unit: g/mol, element_ref: CHEM-ELE-011}
      massa_o: {value: 16.0, unit: g/mol, element_ref: CHEM-ELE-008}
      massa_h: {value: 1.0, unit: g/mol, element_ref: CHEM-ELE-001}
    steps:
      - id: massa_molar
        kind: molar_mass
        composition: {CHEM-ELE-011: 1, CHEM-ELE-008: 1, CHEM-ELE-001: 1}
        expected: {value: 40.0, unit: g/mol, tolerance: 0.01}
      - id: quantidade
        kind: formula
        formula_ref: CHEM-FRM-003
        target: n
        inputs: {m: massa_naoh, M: massa_molar}
        expected: {value: 0.20, unit: mol, tolerance: 0.01}
      - id: molaridade
        kind: formula
        formula_ref: CHEM-FRM-002
        target: c
        inputs: {n_soluto: quantidade, V_solucao: volume_solucao}
        expected: {value: 0.80, unit: mol/L, tolerance: 0.01}
    options:
      - {key: A, text: "M = 40,0 g/mol • n = 0,20 mol • c = 0,05 mol/L", rationale: "Multiplicou 0,20 mol por 0,250 L em vez de dividir pelo volume em litros."}
      - {key: B, text: "M = 40,0 g/mol • n = 0,20 mol • c = 0,80 mol/L", rationale: "Correta; M = 40,0 g/mol, n = 8,0 / 40,0 = 0,20 mol e c = 0,20 / 0,250 L = 0,80 mol/L."}
    correct: B
    worked_solution: >-
      M = 23,0 + 16,0 + 1,0 = 40,0 g/mol; n = 8,0 / 40,0 = 0,20 mol;
      c = 0,20 / 0,250 = 0,80 mol/L.
    scientific_justification: Os índices da fórmula NaOH são todos 1; o volume final é convertido para litros.

  - id: Q-STO-008
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-STO
    skill: Resolver desafio de estequiometria com reagente limitante e rendimento.
    cognitive_level: analysis
    difficulty: 3
    concept_refs: [CHEM-STO-LIMITING, CHEM-STO-YIELD]
    statement: "🔥 [DESAFIO MORTE SÚBITA] Na síntese da água 2 H<sub>2</sub> + O<sub>2</sub> → 2 H<sub>2</sub>O, são misturados 4,0 mol de H<sub>2</sub> e 3,0 mol de O<sub>2</sub>. Sabendo que o rendimento do processo é de 50%, quantos mols de H<sub>2</sub>O são formados?"
    options:
      - {key: A, text: "4,0 mol", rationale: "Calculou a quantidade teórica baseada no H2, sem aplicar o rendimento de 50%."}
      - {key: B, text: "2,0 mol", rationale: "Correta; H2 é o limitante (4,0 mol de H2 produzem teoricamente 4,0 mol de H2O). Com rendimento de 50%, formam-se 2,0 mol de H2O."}
    correct: B
    worked_solution: "1) Proporção 2 H2 : 1 O2. Para 4,0 mol de H2 seriam necessários 2,0 mol de O2. Como temos 3,0 mol de O2, o H2 é o limitante! 2) Teoricamente: 4,0 mol H2 → 4,0 mol H2O. 3) Com rendimento de 50%: 4,0 × 0,50 = 2,0 mol de H2O."
    scientific_justification: "Identificação estequiométrica rigorosa do reagente limitante seguida da aplicação da eficiência real de reação."

  - id: Q-ENV-006
    type: multiple_choice
    version: 1
    status: review
    domain: CHEM-ENV
    skill: Justificar o impacto socioambiental e geoquímico da chuva ácida no solo e corpos d'água.
    cognitive_level: analysis
    difficulty: 3
    concept_refs: [CHEM-ENV-ACIDRAIN, CHEM-ENV-SOCIOECON]
    statement: "🔥 [DESAFIO MORTE SÚBITA] Além de corroer monumentos de mármore (CaCO<sub>3</sub>), por que a chuva ácida causa a mortandade de peixes e vegetação em regiões afetadas?"
    options:
      - {key: A, text: "Porque aumenta a temperatura da água dos rios de forma instantânea.", rationale: "A acidez não altera significativamente a capacidade calorífica da água."}
      - {key: B, text: "Porque a acidificação do solo e da água solubiliza íons metálicos tóxicos (como o Al<sup>3+</sup>), lixiviando nutrientes essenciais.", rationale: "Correta; o pH baixo libera Al3+ solúvel que é altamente tóxico para as guelras dos peixes e raízes."}
    correct: B
    worked_solution: "A diminuição do pH do solo solubiliza metais pesados como o alumínio (Al3+), que é tóxico para peixes (danifica brânquias) e impede a absorção de nutrientes pelas plantas."
    scientific_justification: "Mobilidade geotóxica de cátions metálicos induzida pelo rebaixamento de pH aquoso."
